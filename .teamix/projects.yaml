# 项目清单 & 服务定义
projects:
  - name: mall-system
    git: "git@github.com:team/mall-system.git"
    description: "电商系统"
    services:
      - name: mall-gateway
        type: backend
        dir: mall-gateway/
        startup: "mvn spring-boot:run -pl mall-gateway"
        port: 8080
      - name: mall-order
        type: backend
        dir: mall-order/
        startup: "mvn spring-boot:run -pl mall-order"
        port: 8081
        depends_on: [mall-gateway]
      - name: mall-product
        type: backend
        dir: mall-product/
        startup: "mvn spring-boot:run -pl mall-product"
        port: 8082
        depends_on: [mall-gateway]
      - name: mall-admin-ui
        type: frontend
        dir: mall-admin-ui/
        startup: "npm run dev"
        port: 3000

  - name: crm-system
    git: "git@github.com:team/crm-system.git"
    description: "客户管理系统"
    services:
      - name: crm-server
        type: backend
        dir: .
        startup: "mvn spring-boot:run"
        port: 8090
      - name: crm-web
        type: frontend
        dir: crm-web/
        startup: "npm run dev"
        port: 3001
