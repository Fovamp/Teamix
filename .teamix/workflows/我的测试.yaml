name: 我的测试
label: 我的测试
description: 环境检查（后端+小工具+前端） → 按规范生成测试用例 JSON → 发送测试并查看报告
stages:
    - name: health
      label: 环境检查（后端+小工具+前端）
      prompt: |-
        ## Stage: generate — 按规范生成测试用例 JSON

        用户提供了一个文件，你需要按以下规范生成测试用例 JSON 数组。

        ============ 规范开始 ============
        # 第一步：自动判断文件类型
        - 如果文件路径以 .java、.kt、.cs 结尾，或源码包含 @RestController、@RequestMapping、public class XXXController 等后端注解 → 后端文件
        - 如果文件路径以 .vue、.jsx、.tsx、.html 结尾，或源码包含 <template>、<script>、export default 等前端特征 → 前端文件
        - 无法判断默认按后端处理

        # 第二步：根据类型生成

        ## 如果是后端文件（targetType 全为 "BACKEND"
        全局请求头要求：所有后端测试用例发起请求时，必须在请求头（Header）中添加 x-access-token。该 Token 必须通过预先调用接口 /event/technologyAceEvent/getTemporaryToken 获取，并将获取到的 Token 值动态填入每个请求的 Headers 中。因此，每个测试用例的 JSON 对象中必须包含一个 headers 字段，其值为一个对象，内含 x-access-token 键，键值应设置为占位符（例如 "{{token}}"），并在测试执行前通过调用上述接口获取实际 Token 进行替换。测试用例本身不包含获取 Token 的步骤，但执行测试的框架需确保先调用该接口以获取有效Token。
        用例 JSON 结构要求：
        每个用例必须包含：caseName（字符串）、targetType（固定 "BACKEND"）、method（HTTP 方法）、path（接口路径）、payload（请求体 JSON 字符串，GET 请求可传空对象 "{}"）、expectedStatus（预期 HTTP 状态码）、assertContain（预期响应中包含的字符串，无则 null）、headers（对象，必须包含 x-access-token 字段，值为占位符 "{{token}}"）、pageUrl（固定 null）、actions（固定 null）。

        三类用例：
        1. Diff变更测试（diff为空跳过）：仅接口业务逻辑变更，每个变更点≥1个
        2. 整体功能测试（必须）：所有public接口方法，覆盖正常/参数校验失败/业务异常/权限不足；文件上传下载必须含安全测试(路径穿越/非法后缀/空文件)
        3. 用户场景测试（必须）：1~3个端到端场景，串联多接口完成业务闭环

        ## 前端文件（targetType 全为 "FRONTEND"）
        每个用例必含：caseName、targetType("FRONTEND")、category("Diff变更"/"整体功能"/"用户场景")、pageUrl(页面路由)、locator(对象，含type/value/name)、action(click/fill/selectOption/check/uncheck/goto/hover)、actionParams(对象，action为fill时含value字段)、assertions(数组，每项含type/可选locator/可选expected)、beforeAction(前置操作数组，每项含action/value)

        三类用例：
        1. Diff变更测试（diff为空跳过）：仅UI交互逻辑变更
        2. 整体功能测试（必须）：所有可交互元素，覆盖按钮点击/表单输入/下拉选择/弹窗/导航
        3. 用户场景测试（必须）：1~3个真实操作流，每步一个用例，同场景用例共享scenarioStep编号
        ============ 规范结束 ============

        ### 你的任务
        1. 读取用户提供的文件内容
        2. 按规范判断文件类型
        3. 按规范生成测试用例 JSON 数组
        4. **直接输出 JSON 数组**，格式：`[{ "caseName": "...", "targetType": "...", ... }, ...]`
        5. 不要加外层包装，不要加 markdown 代码块标记

        完成时输出 `阶段完成: 已生成测试用例 JSON`。
