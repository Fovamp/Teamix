name: self-test
label: AI 自测试
description: 环境检查（后端+小工具+前端） → 按规范生成测试用例 JSON → 发送测试并查看报告
stages:
    - name: health
      label: 环境检查（后端+小工具+前端）
      prompt: |-
        ## Stage: health — 检查三个服务是否正常运行

        在执行测试之前，先确认以下三个服务是否在线：

        1. **JeecgBoot 后端**：发送 GET 请求到 `http://192.168.29.110:8080/atcp-ace-manager/`
           - 如果可访问 → 后端正常
           - 如果连接失败 → 执行 restart.bat 启动后端
        2. **小工具（测试服务）**：发送 GET 请求到 `http://192.168.29.110:8081/`
           - 如果可访问 → 小工具正常
           - 如果连接失败 → 提示用户启动 IDEA 中的小工具项目
        3. **前端（JeecgBoot Vue3）**：发送 GET 请求到 `http://192.168.29.110:3100/`
           - 如果可访问 → 前端正常
           - 如果连接失败 → 自检查，然后启动vite服务器

        输出检查结果摘要，标记哪些服务正常、哪些异常。全部正常后再进入下一阶段。

        完成时输出 `阶段完成: 环境检查完成`。
    - name: generate
      label: 按规范生成测试用例 JSON
      prompt: |-
        ## Stage: generate — 按规范生成测试用例 JSON

        用户提供了一个文件，你需要按以下规范生成测试用例 JSON 数组。

        ============ 规范开始 ============
        # 第一步：自动判断文件类型
        - 如果文件路径以 .java、.kt、.cs 结尾，或源码包含 @RestController、@RequestMapping、public class XXXController 等后端注解 → 后端文件
        - 如果文件路径以 .vue、.jsx、.tsx、.html 结尾，或源码包含 <template>、<script>、export default 等前端特征 → 前端文件
        - 无法判断默认按后端处理

        # 第二步：根据类型生成

        ## 后端文件（targetType 全为 "BACKEND"）
        全局请求头要求：所有后端测试用例发起请求时，必须在请求头（Header）中添加 x-access-token。该 Token 必须通过预先占位，每个测试用例的 JSON 对象中必须包含一个 headers 字段，其值为一个对象，内含 x-access-token 键，键值应设置为占位符（例如 "{{token}}"），并在测试阶段等待用户输入实际 Token 进行替换。测试用例本身不包含获取 Token 的步骤，但执行测试的框架需确保先调用该接口以获取有效Token。
        每个用例必含：caseName、targetType("BACKEND")、method、path、payload(JSON字符串)、expectedStatus、assertContain(null或字符串)、headers(必须含 x-access-token: "{{token}}")、pageUrl(null)、actions(null)

        两类用例：
        1. 整体功能测试（必须）：所有public接口方法，覆盖正常/参数校验失败/业务异常/权限不足；文件上传下载必须含安全测试(路径穿越/非法后缀/空文件)
        2. 用户场景测试（必须）：1~3个端到端场景，串联多接口完成业务闭环

        ## 前端文件（targetType 全为 "FRONTEND"）
        每个用例必含：caseName、targetType("FRONTEND")、category("Diff变更"/"整体功能"/"用户场景")、pageUrl(页面路由)、locator(对象，含type/value/name)、action(click/fill/selectOption/check/uncheck/goto/hover)、actionParams(对象，action为fill时含value字段)、assertions(数组，每项含type/可选locator/可选expected)、beforeAction(前置操作数组，每项含action/value)

        两类用例：
        1. 整体功能测试（必须）：所有可交互元素，覆盖按钮点击/表单输入/下拉选择/弹窗/导航
        2. 用户场景测试（必须）：1~3个真实操作流，每步一个用例，同场景用例共享scenarioStep编号
        ============ 规范结束 ============

        ### 你的任务
        1. 读取用户提供的文件内容
        2. 按规范判断文件类型
        3. 按规范生成测试用例 JSON 数组
        4. **直接输出 JSON 数组**，格式：`[{ "caseName": "...", "targetType": "...", ... }, ...]`
        5. 不要加外层包装，不要加 markdown 代码块标记
        6. 查询尽量使用知识库，查数据使用mysql

        完成时输出 `阶段完成: 已生成测试用例 JSON`。
    - name: execute
      label: 发送测试并查看报告
      prompt: |-
        ## Stage: execute — 发送测试到远程服务器

        上一阶段已经生成了测试用例 JSON 数组，现在执行以下操作：

        1. **发送请求**：POST `http://192.168.29.110:8081/api/v1/test/run`
           - 请求头: `Content-Type: application/json`
           - 请求体: 上一阶段生成的 testCases JSON 数组
        2. **输出响应结果**：展示服务器返回的测试状态。

        完成后在回复末尾输出标记：
        ```
        __打开页面__: http://192.168.29.110:55555 - Allure测试报告
        ```

        完成时输出 `阶段完成: 测试完成，已展示报告链接`。
