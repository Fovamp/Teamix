name: standard
label: 标准开发流程
description: 需求分析 → 功能开发 → 代码审查 → 效果查看 → 自动测试 → 入库提交
stages:
    - name: refine
      label: 需求分析
      prompt: |-
        ## Stage: refine
        与用户沟通需求，自己读取codebase-memory-mcp知识库读取项目架构，根据用户要求分析，明确边界和验收标准。输出 PRD 文档。
    - name: develop
      label: 功能开发
      prompt: |-
        ## Stage: develop
        按需求实现功能。遵循项目规范，编写可维护的代码。
    - name: review
      label: 代码审查
      prompt: |-
        ## Stage: review
        审查代码的正确性、质量、安全性和性能。分析本次修改影响了哪些模块和服务（关联性分析），确保改动的影响范围清晰。
    - name: verify
      label: 效果查看
      prompt: |-
        ## Stage: verify
        验证修改效果：
        1. 执行 restart.bat 编译并重启后端
        2. 前端 Vite 自动热更新，无需重启
        3. 修改完成后，在回复末尾输出 __打开页面__ 标记告知用户查看效果
           格式：__打开页面__: <完整URL> - <页面描述>
           注意：URL 必须以 http:// 或 https:// 开头，不能使用 javascript: 等协议；- <页面描述> 是必须的，不能省略
           例如：__打开页面__: http://localhost:5173/system/tenant - 租户管理页面
           可输出多个标记打开多个页面
        4. 等待 15 秒后通知用户检查效果，确认正常后进入下一阶段
    - name: test
      label: 自动测试
      prompt: |-
        ## Stage: test
        编写并运行测试用例。确保覆盖率和无回归。
    - name: commit
      label: 入库提交
      prompt: |-
        ## Stage: commit
        整理变更，编写 commit message，提交入库。
