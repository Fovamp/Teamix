name: "review"
label: "代码审查"
description: "提交代码 → 自动扫描 → 关联性分析 → 人工审查 → 生成报告 → 合并入库"
stages:
  - name: "submit"
    label: "提交代码"
    prompt: |-
      ## Stage: submit - 提交代码
      审查本次代码变更的 diff，检查明显问题：
      1. 使用 git diff HEAD~1 或 git diff --cached 获取变更内容
      2. 检查语法错误、明显的逻辑缺陷
      3. 检查代码风格是否符合项目规范
      4. 输出变更概览：修改了哪些文件、多少行

      完成后输出"阶段完成: 提交代码审查完成"。

  - name: "scan"
    label: "自动扫描"
    prompt: |-
      ## Stage: scan - 自动扫描
      对本次提交的代码运行静态分析：
      1. 检查代码质量问题：未使用的变量、错误的错误处理、潜在的空指针
      2. 检查安全风险：SQL 注入、XSS、路径遍历、硬编码密钥等
      3. 检查测试覆盖：本次修改是否有对应的测试用例
      4. 使用可用的静态分析工具检查代码
      5. 汇总发现的全部问题，按严重程度分类

      完成后输出"阶段完成: 自动扫描完成，共发现 X 个问题"。

  - name: "analysis"
    label: "关联性分析"
    prompt: |-
      ## Stage: analysis - 关联性分析
      分析本次代码变更的影响范围。

      > 变更文件列表已在上下文【变更文件列表】中提供，你不需要执行 git diff。
      > 调用链分析完成后请将结果写入文件，系统会自动读取并通知关联用户。

      ### 第一步：用 MCP 工具查调用链
      对每个变更文件，提取其中的 Controller 接口和 Service 方法（如 @RequestMapping、public 方法、Feign 接口等），
      使用 codebase-memory MCP 工具查询调用链：

      1. search_graph --name-pattern <函数名> 查找调用者
      2. 或 trace_path --function <函数名> --mode cross_service --depth 2

      记录所有调用了这些函数/接口的文件路径。

      ### 第二步：将结果写入文件
      使用 write_file 工具写入：
      .teamix/impact-analysis/{SESSION_ID}.json

      JSON 格式（必须）：
      {"callerFiles": ["调用方文件1.java", "调用方文件2.java"]}

      ### 第三步：汇总输出
      输出分析结果：
      - 变更文件及导出函数/接口
      - 调用方文件列表
      - 影响范围评估
      - 关联用户（系统将自动通知）

      完成后输出"阶段完成: 关联性分析完成"。

  - name: "review"
    label: "人工审查"
    prompt: |-
      ## Stage: review - 人工审查
      基于前面 submit/scan/analysis 阶段的结果，进行深入审查：
      1. 逻辑正确性：边界条件是否处理？
      2. 安全性：是否存在安全漏洞？
      3. 性能：是否有性能隐患？
      4. 测试覆盖：是否有合理的测试覆盖？
      5. 兼容性：是否向后兼容？
      6. 输出审查意见，标记必须修复项和建议改进项

      完成后输出"阶段完成: 人工审查完成，共 X 项意见"。

  - name: "report"
    label: "生成报告"
    prompt: |-
      ## Stage: report - 生成审查报告
      综合所有阶段的发现，生成完整的审查报告：

      # 代码审查报告

      ## 概述
      - 提交者：[用户名]
      - 分支：[当前分支]
      - 变更文件数：[数量]
      - 审查日期：[日期时间]

      ## 1. 变更概览
      - 文件列表及变更行数

      ## 2. 自动扫描结果
      - 严重问题 / 警告 / 建议

      ## 3. 关联性分析
      - 影响范围：[高/中/低]
      - 受影响模块：[列表]
      - 关联用户：[列表]
      - 已通知用户：[列表]

      ## 4. 人工审查意见
      - 必须修复 / 建议改进

      ## 5. 审查结论
      - [通过/有条件通过/拒绝]
      - 审批人：[待人工填写]

      报告完成后展示给用户，等待人工审核确认。

      完成后输出"阶段完成: 审查报告已生成，等待人工审核确认"。

  - name: "merge"
    label: "合并入库"
    prompt: |-
      ## Stage: merge - 合并入库
      等待人工确认后执行合并入库操作：
      1. 确认所有必须修复项已修复
      2. 检查是否有合并冲突
      3. 准备 commit message（引用审查报告）
      4. 合并到目标分支并提交入库

      如果不满足合并条件，说明原因并等待用户决定。

      完成后输出"阶段完成: 代码已合并入库"。
